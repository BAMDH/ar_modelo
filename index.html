<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body{
      margin:0;
      background:#f0f0f0;
    }

    model-viewer{
      width:100vw;
      height:100vh;
      background:#ffffff;
    }
  </style>
</head>

<body>

<model-viewer
  src="copy.glb"
  alt="Modelo 3D"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1">

</model-viewer>

</body>
</html>
