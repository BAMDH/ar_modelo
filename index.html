<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: transparent;
    }
  </style>
</head>

<body>

<model-viewer
  src="modelo.glb"

  ar
  ar-modes="scene-viewer"

  camera-controls
  auto-rotate

  environment-image="neutral"

  shadow-intensity="1"

  ar-scale="fixed"

  ar-placement="floor">

</model-viewer>

</body>
</html>
